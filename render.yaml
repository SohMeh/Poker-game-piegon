# Render blueprint: a single Node web service (HTTP + websockets on the same port).
# Rooms are kept in memory, so keep ONE instance; a redeploy/restart ends games in progress.
services:
  - type: web
    name: flock-poker
    runtime: node
    plan: free
    numInstances: 1
    # dev dependencies (vite, esbuild, typescript) are needed for the build step
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Render's proxy sits in front of the app and appends the caller's IP to X-Forwarded-For;
      # trusting that one hop gives per-client rate limits (room creation, joins). Add one per
      # extra proxy (e.g. a CDN) you put in front.
      - key: TRUST_PROXY_HOPS
        value: "1"
      # Optional: your public URL, used for absolute link-preview images in group chats.
      # Without it the server uses the request's own host, which works on Render as is.
      # - key: PUBLIC_URL
      #   value: https://flock-poker.onrender.com
